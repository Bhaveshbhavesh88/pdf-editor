<style>
/* Layout: three-column proofing desk. Page strip left, paper in the middle, style panel right. */
:root{
  --desk:#e6e9ef; --desk2:#d7dce6; --panel:#ffffff; --panel2:#f2f4f9; --ink:#1b2130; --muted:#626d86; --line:#d3d9e5;
  --accent:#2f5bd8; --accent-ink:#ffffff; --accent-soft:#e2e9fc; --danger:#c8372d;
  --shadow:0 1px 2px rgba(20,30,60,.14),0 10px 28px rgba(20,30,60,.14);
  --font-ui:Inter,"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Space Grotesk",Inter,"Noto Sans Devanagari",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#13161d; --desk2:#0d0f14; --panel:#1c202a; --panel2:#262b38; --ink:#e8ebf3; --muted:#9aa4ba; --line:#333a4c;
  --accent:#7d9cff; --accent-ink:#0d1226; --accent-soft:#273157; --danger:#ff7b6e;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#13161d; --desk2:#0d0f14; --panel:#1c202a; --panel2:#262b38; --ink:#e8ebf3; --muted:#9aa4ba; --line:#333a4c;
  --accent:#7d9cff; --accent-ink:#0d1226; --accent-soft:#273157; --danger:#ff7b6e;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  background:var(--desk);color:var(--ink);font:14px/1.45 var(--font-ui);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:26px;height:26px;color:var(--accent);flex:none}
.brand b{font:700 17px var(--font-display);letter-spacing:-.01em}
.fname{color:var(--muted);font-size:12.5px;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-weight:500;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:progress}
.ib{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--panel2);padding:0}
.ib svg{width:18px;height:18px}
.ib:hover{border-color:var(--accent)}
.ib:disabled{opacity:.4;cursor:default}
.ib[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.zoom{display:flex;align-items:center;gap:4px;padding:0 4px;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.zoom span{min-width:46px;text-align:center}
.tools{display:flex;align-items:center;gap:4px;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:0;scrollbar-width:thin}
.tool{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:6px 6px 5px;border-radius:9px;border:1px solid transparent;background:none;font-size:11px;color:var(--ink)}
.tool svg{width:20px;height:20px}
.tool:hover{background:var(--panel2)}
.tool[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sep{flex:none;width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
.hint{flex:1 0 220px;color:var(--muted);font-size:12.5px;padding:0 8px;min-width:0}
.only-narrow{display:none}
.ws{display:grid;grid-template-columns:150px minmax(0,1fr) 272px;gap:10px;min-height:0}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;min-height:0}
.view{overflow:auto;background:var(--desk2);border-radius:12px;border:1px solid var(--line);min-width:0;min-height:0;position:relative}
#pages{width:max-content;min-width:100%;display:flex;flex-direction:column;align-items:center;padding:18px 16px 40px}
.pg{position:relative;flex:none;margin:0 0 18px;background:#fff;box-shadow:var(--shadow)}
.pg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pgn{position:absolute;left:0;top:-16px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ov{position:absolute;inset:0;overflow:hidden}
.osv{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.ta{position:absolute;pointer-events:none;line-height:1.2;white-space:pre;min-height:1.2em;min-width:8px}
.ta.editing{pointer-events:auto;outline:1.5px solid var(--accent);cursor:text;background:rgba(125,156,255,.1)}
.selbox{position:absolute;border:1.5px dashed var(--accent);pointer-events:none}
.hnd{position:absolute;right:-7px;bottom:-7px;width:13px;height:13px;background:var(--accent);border:2px solid #fff;border-radius:4px;pointer-events:auto;cursor:nwse-resize;touch-action:none}
.hover{position:absolute;pointer-events:none;border:1.5px solid var(--accent);background:rgba(47,91,216,.12);border-radius:2px}
.wmk{position:absolute;left:50%;top:50%;white-space:nowrap;font-weight:700;pointer-events:none;font-family:Helvetica,Arial,sans-serif}
.pnum{position:absolute;pointer-events:none;font-family:Helvetica,Arial,sans-serif;color:#000}
.view[data-tool=select] .ov{touch-action:pan-x pan-y}
.view:not([data-tool=select]) .ov{touch-action:none}
.view[data-tool=text] .ov,.view[data-tool=edittext] .ov{cursor:text}
.view[data-tool=pen] .ov,.view[data-tool=rect] .ov,.view[data-tool=ellipse] .ov,.view[data-tool=line] .ov,.view[data-tool=arrow] .ov,.view[data-tool=highlight] .ov,.view[data-tool=whiteout] .ov{cursor:crosshair}
.view[data-tool=eraser] .ov{cursor:not-allowed}
.opsbar{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;background:var(--panel);border-bottom:1px solid var(--line)}
.opsbar .ib{width:100%;height:30px}
.opsbar .ib svg{width:16px;height:16px}
#thumbs{padding:4px 8px 12px}
.th{position:relative;margin:8px auto;width:110px;cursor:grab;border:2px solid transparent;border-radius:6px;padding:3px;background:var(--panel2)}
.th canvas{display:block;width:100%;height:auto;background:#fff}
.th.sel{border-color:var(--accent)}
.th.over{outline:2px dashed var(--accent)}
.num{margin-top:3px;text-align:center;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;border-radius:4px}
.th.cur .num{background:var(--accent);color:var(--accent-ink)}
.card{padding:12px;border-bottom:1px solid var(--line)}
.card h3,.card summary{margin:0 0 8px;font:700 13px var(--font-display);letter-spacing:.01em}
details.card summary{cursor:pointer;margin:0}
details.card[open] summary{margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font-size:13px}
.row label{color:var(--muted);display:flex;align-items:center;gap:6px}
.row input[type=color]{width:40px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.row input[type=range]{width:120px;accent-color:var(--accent)}
.row input[type=number],.row input[type=text],.row select{width:130px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:0 8px}
.row.col{flex-direction:column;align-items:stretch}
.row.col input[type=text]{width:100%}
.muted{color:var(--muted);font-size:12.5px;margin:6px 0}
.tg{width:34px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--panel2)}
.tg[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.fld{margin:8px 0;font-size:13px}
.fld label{display:block;color:var(--muted);font-size:12px;margin-bottom:2px;overflow-wrap:anywhere}
.fld input[type=text],.fld select{width:100%;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:0 8px}
.pop{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:grid;gap:4px;min-width:170px}
.pop button{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:6px 10px}
.pop button:hover{border-color:var(--accent)}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(10,14,25,.5);padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(520px,100%);box-shadow:var(--shadow)}
.modal h3{margin:0 0 10px;font:700 16px var(--font-display)}
#sigPad{width:100%;height:auto;aspect-ratio:3/1;border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;display:block;cursor:crosshair}
.modal .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:10px;font-size:13px;max-width:min(92vw,520px);box-shadow:var(--shadow)}
.scrim{position:fixed;inset:0;background:rgba(10,14,25,.4);z-index:25}
@media (max-width:960px){
  .ws{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;z-index:30;width:min(300px,88vw);border-radius:0;transition:transform .2s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .side.left{left:0;transform:translateX(-105%);padding-left:env(safe-area-inset-left,0px)}
  .side.right{right:0;transform:translateX(105%);padding-right:env(safe-area-inset-right,0px)}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .only-narrow{display:flex}
  .fname{display:none}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>

/* ---------- loading ---------- */
async function getPg(p){const k=p.src+':'+p.idx;if(pageCache.has(k))return pageCache.get(k);const pg=await state.srcs[p.src].pdf.getPage(p.idx+1);pageCache.set(k,pg);return pg;}
async function addSource(bytes,name){
  const id='s'+(++srcCount);
  const doc=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
  state.srcs[id]={bytes,pdf:doc,name};
  const pages=[];
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i);pageCache.set(id+':'+(i-1),pg);
    const v=pg.view;
    pages.push({id:uid(),src:id,idx:i-1,rot:0,nat:(((pg.rotate||0)%360)+360)%360,W:v[2]-v[0],H:v[3]-v[1],blank:false,annots:[]});
  }
  return {id,pages,doc};
}
async function detectForms(id){
  const L=PDFLib;state.forms[id]=[];
  try{
    const d=await L.PDFDocument.load(state.srcs[id].bytes,{ignoreEncryption:true,updateMetadata:false});
    const form=d.getForm();
    for(const f of form.getFields()){
      const name=f.getName();let kind=null,value='',options=[];
      if(f instanceof L.PDFTextField){kind='text';value=f.getText()||'';}
      else if(f instanceof L.PDFCheckBox){kind='check';value=f.isChecked();}
      else if(f instanceof L.PDFDropdown){kind='select';options=f.getOptions();value=(f.getSelected()[0])||'';}
      else if(f instanceof L.PDFOptionList){kind='select';options=f.getOptions();value=(f.getSelected()[0])||'';}
      else if(f instanceof L.PDFRadioGroup){kind='select';options=f.getOptions();value=f.getSelected()||'';}
      if(kind)state.forms[id].push({name,kind,value,options});
    }
  }catch(e){}
}
function renderForms(){
  const box=$('#formsBox');box.innerHTML='';
  const all=[];Object.keys(state.forms).forEach(id=>state.forms[id].forEach(f=>all.push({id,f})));
  if(!all.length){const p=document.createElement('p');p.className='muted';p.textContent=t('noforms');box.appendChild(p);return;}
  all.forEach(({id,f},k)=>{
    const wrap=document.createElement('div');wrap.className='fld';
    const lab=document.createElement('label');lab.textContent=f.name;lab.htmlFor='ff'+k;wrap.appendChild(lab);
    const cur=(state.formVals[id]&&f.name in state.formVals[id])?state.formVals[id][f.name]:f.value;
    let inp;
    if(f.kind==='text'){inp=document.createElement('input');inp.type='text';inp.value=cur;}
    else if(f.kind==='check'){inp=document.createElement('input');inp.type='checkbox';inp.checked=!!cur;}
    else{inp=document.createElement('select');const o0=document.createElement('option');o0.value='';o0.textContent='-';inp.appendChild(o0);f.options.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;inp.appendChild(op);});inp.value=cur;}
    inp.id='ff'+k;
    const upd=()=>{(state.formVals[id]=state.formVals[id]||{})[f.name]=f.kind==='check'?inp.checked:inp.value;};
    inp.addEventListener(f.kind==='text'?'input':'change',upd);
    wrap.appendChild(inp);box.appendChild(wrap);
  });
}
function resetAll(){
  Object.values(state.srcs).forEach(s=>{try{s.pdf.destroy();}catch(e){}});
  state.srcs={};state.pages=[];state.sel=new Set();state.cur=0;state.selId=null;state.forms={};state.formVals={};state.imgs={};
  pageCache.clear();tiCache.clear();thumbCache.clear();undoS.length=0;redoS.length=0;updBtns();
}
async function openBytes(bytes,name,isSample){
  try{
    resetAll();
    srcCount=0;
    const r2=await addSource(bytes,name);
    state.pages=r2.pages;state.fileName=name;
    await detectForms(r2.id);
    try{const m=await r2.doc.getMetadata();state.meta.title=(m.info&&m.info.Title)||'';state.meta.author=(m.info&&m.info.Author)||'';}catch(e){state.meta.title='';state.meta.author='';}
    $('#mTitle').value=state.meta.title;$('#mAuthor').value=state.meta.author;
    $('#fname').textContent=name;
    fitWidth(true);afterStruct();renderForms();
    if(isSample)toast(t('sample'),5000);
  }catch(e){
    console.warn(e);
    toast(e&&e.name==='PasswordException'?t('enc'):t('loadfail'));
  }
}
function readBuf(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(new Uint8Array(fr.result));fr.onerror=rej;fr.readAsArrayBuffer(file);});}

const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting)renderPage(en.target);});},{root:view,rootMargin:'700px 0px'});
function buildPages(){
  if(state.editing&&document.activeElement)document.activeElement.blur();
  io.disconnect();host.innerHTML='';
  const z=state.zoom;
  state.pages.forEach((p,i)=>{
    const d=dims(p),el=document.createElement('div');
    el.className='pg';el.dataset.i=i;el.style.width=(d.w*z)+'px';el.style.height=(d.h*z)+'px';
    el.innerHTML='<canvas></canvas><div class="ov"></div><span class="pgn">'+(i+1)+'</span>';
    host.appendChild(el);io.observe(el);drawOverlay(i);
  });
  $('#zPct').textContent=Math.round(z*100)+'%';
  updatePager();
}
async function renderPage(el){
  const i=+el.dataset.i,p=state.pages[i];if(!p)return;
  const R=(p.nat+p.rot)%360,z=state.zoom,key=p.src+':'+p.idx+':'+R+':'+z;
  if(el._key===key)return;el._key=key;
  const cv=el.querySelector('canvas');
  if(p.blank){cv.style.display='none';return;}
  try{
    const pg=await getPg(p),dpr=Math.min(window.devicePixelRatio||1,2);
    const vp=pg.getViewport({scale:z*dpr,rotation:R});
    const off=document.createElement('canvas');off.width=Math.max(1,Math.floor(vp.width));off.height=Math.max(1,Math.floor(vp.height));
    if(el._task){try{el._task.cancel();}catch(e){}}
    const task=pg.render({canvasContext:off.getContext('2d'),viewport:vp});el._task=task;

    catch(err){if(err&&err.code==='declined'){toast(t('declined'));return;}console.warn(err);}
  }
  try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast(t('saved'));}
  catch(e){toast(t('failed'));}
}
let saving=false;
async function save(idxs,suffix){
  if(saving||!state.pages.length)return;saving=true;$('#bSave').disabled=true;toast(t('building'),0);
  try{
    if(state.editing&&document.activeElement)document.activeElement.blur();
    const bytes=await buildPdf(idxs);
    const base=state.fileName.replace(/\.pdf$/i,'');
    await deliver(bytes,base+(suffix||'-edited')+'.pdf');
  }catch(e){console.warn(e);toast(t('failed')+': '+(e&&e.message?e.message:''),5000);}
  saving=false;$('#bSave').disabled=false;
}

/* ---------- UI wiring ---------- */
function closeDrawers(){$$('.side.open').forEach(s=>s.classList.remove('open'));const sc=$('.scrim');if(sc)sc.remove();}
function toggleDrawer(id){const s=$(id),was=s.classList.contains('open');closeDrawers();if(!was){s.classList.add('open');const sc=document.createElement('div');sc.className='scrim';sc.addEventListener('click',closeDrawers);document.body.appendChild(sc);}}
function bindUI(){
  applyIcons();bindProps();
  $$('.tool[data-tool]').forEach(b=>b.addEventListener('click',()=>{setTool(b.dataset.tool);}));
  $('#tImage').addEventListener('click',()=>$('#fImg').click());
  $('#tSign').addEventListener('click',openSig);
  $('#tStamp').addEventListener('click',e=>openStampMenu(e.currentTarget));
  document.addEventListener('click',e=>{const m=$('#stampMenu');if(!m.hidden&&!e.target.closest('#stampMenu')&&!e.target.closest('#tStamp'))m.hidden=true;});
  $('#fImg').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{placeImage(await loadImageFile(f),200);}catch(x){toast(t('failed'));}});
  $('#sigClear').addEventListener('click',()=>{sg.clearRect(0,0,sig.width,sig.height);sigInk=false;});
  $('#sigCancel').addEventListener('click',closeSig);$('#sigUse').addEventListener('click',useSig);
  $('#bOpen').addEventListener('click',()=>$('#fOpen').click());
  $('#fOpen').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)await openBytes(await readBuf(f),f.name);});
  $('#oMerge').addEventListener('click',()=>$('#fMerge').click());
  $('#fMerge').addEventListener('change',async e=>{const fs=Array.from(e.target.files);e.target.value='';await mergeFiles(fs);});
  $('#bUndo').addEventListener('click',undoF);$('#bRedo').addEventListener('click',redoF);
  $('#zIn').addEventListener('click',()=>setZoom(state.zoom*1.15));$('#zOut').addEventListener('click',()=>setZoom(state.zoom/1.15));$('#zFit').addEventListener('click',()=>fitWidth(false));
  $('#bLang').addEventListener('click',()=>{lang=lang==='hi'?'en':'hi';try{localStorage.setItem('pdfpro-lang',lang);}catch(e){}applyLang();});
  $('#bSave').addEventListener('click',()=>save());
  $('#oRotL').addEventListener('click',()=>rotate(-90));$('#oRotR').addEventListener('click',()=>rotate(90));
  $('#oUp').addEventListener('click',()=>movePages(-1));$('#oDown').addEventListener('click',()=>movePages(1));
  $('#oDel').addEventListener('click',delPages);$('#oDup').addEventListener('click',dupPages);$('#oBlank').addEventListener('click',addBlank);
  $('#oExtract').addEventListener('click',()=>{const ts=targets();save(ts,'-pages-'+(ts[0]+1)+(ts.length>1?'-'+(ts[ts.length-1]+1):''));});
  $('#oMulti').addEventListener('click',e=>{state.multi=!state.multi;e.currentTarget.setAttribute('aria-pressed',String(state.multi));});
  $('#bPagesT').addEventListener('click',()=>toggleDrawer('#sideL'));$('#bPropsT').addEventListener('click',()=>toggleDrawer('#sideR'));
  // drag a PDF onto the desk
  view.addEventListener('dragover',e=>{if(e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files'))e.preventDefault();});
  view.addEventListener('drop',async e=>{const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(!f)return;e.preventDefault();if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name))await openBytes(await readBuf(f),f.name);});
  document.addEventListener('keydown',e=>{
    const inField=e.target.closest&&e.target.closest('input,select,textarea,[contenteditable]');
    if(e.ctrlKey||e.metaKey){const k=e.key.toLowerCase();
      if(k==='s'){e.preventDefault();save();}
      else if(!inField&&k==='z'){e.preventDefault();if(e.shiftKey)redoF();else undoF();}
      else if(!inField&&k==='y'){e.preventDefault();redoF();}
      return;}
    if(inField)return;
    if(e.key==='Delete'||e.key==='Backspace'){if(selAnnot()){e.preventDefault();delSel();}}
    else if(e.key==='Escape'){select(null);setTool('select');closeDrawers();$('#stampMenu').hidden=true;closeSig();}
  });
  }

/* ---------- start ---------- */
(async function init(){
  bindUI();setTool('select');applyLang();updBtns();
  if(!window.pdfjsLib||!window.PDFLib){toast(t('libfail'),0);return;}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  try{const bytes=await makeSample();await openBytes(bytes,'sample-invoice.pdf',true);}catch(e){console.warn(e);toast(t('loadfail'));}
})();
})();
</script>
